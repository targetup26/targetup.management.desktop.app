<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Forms - TargetUP</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .forms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .form-template-card {
            background: linear-gradient(145deg, rgba(21, 25, 28, 0.4), rgba(11, 14, 18, 0.6));
            border: 1px solid var(--border-subtle);
            backdrop-filter: var(--glass-blur);
            border-radius: 20px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.4s var(--ease-pro);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: var(--shadow-pro);
        }

        .form-template-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 163, 255, 0.1);
        }

        .form-template-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(to bottom, var(--accent-blue), transparent);
            opacity: 0.6;
        }

        .template-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
        }

        .template-name {
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .template-description {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .submissions-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
            margin-top: 10px;
        }

        .submissions-table th {
            padding: 15px 20px;
            text-align: left;
            font-size: 0.7rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1.5px;
        }

        .submissions-table tr {
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.2s;
        }

        .submissions-table td {
            padding: 18px 20px;
            font-size: 0.9rem;
            border-top: 1px solid transparent;
            border-bottom: 1px solid transparent;
        }

        .submissions-table tr td:first-child {
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
            border-left: 1px solid transparent;
        }

        .submissions-table tr td:last-child {
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
            border-right: 1px solid transparent;
        }

        .submissions-table tr:hover {
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }

        .submissions-table tr:hover td {
            border-color: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 0 5px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-refresh {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-refresh:hover {
            background: var(--bg-hover);
            color: #fff;
            border-color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            padding: 80px 40px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            border: 1px dashed var(--border-subtle);
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="drag-overlay"></div>
    <div class="app-container">
        <!-- Navigation Rail -->
        <div class="nav-rail">
            <div class="nav-logo">T</div>
            <div class="nav-icon" onclick="openDashboard()" title="Dashboard">🏠</div>
            <div class="nav-icon" onclick="openChat()" title="Team Communications">💬</div>
            <div class="nav-icon active" title="Forms">📋</div>
            <div class="nav-icon" onclick="openFiles()" title="File Management">📁</div>
            <div style="flex: 1;"></div>
            <div class="nav-icon" onclick="logout()" title="Log Out" style="color: var(--accent-red);">
                🔒</div>
        </div>

        <!-- Main Content -->
        <div class="main-stage glass-stage">
            <div class="stage-header" style="height: 64px;">
                <div class="stage-title">FORMS</div>
                <div class="window-controls">
                    <div class="control-btn" onclick="minimizeToTray()">&#8211;</div>
                    <div class="control-btn control-close" onclick="minimizeToTray()">&times;</div>
                </div>
            </div>

            <div class="scroll-content">
                <!-- Available Forms Section -->
                <div class="section-header">
                    <div class="section-title">📝 Available Forms</div>
                </div>
                <div class="forms-grid" id="formsGrid">
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">
                        Loading templates...
                    </div>
                </div>

                <!-- My Submissions Section -->
                <div class="section-header" style="margin-top: 60px;">
                    <div class="section-title">📊 My Submissions</div>
                    <button class="btn-refresh" onclick="loadSubmissions()">🔄 Refresh</button>
                </div>
                <table class="submissions-table" id="submissionsTable">
                    <thead>
                        <tr>
                            <th>Form Type</th>
                            <th>Submitted</th>
                            <th>Status</th>
                            <th>Signatures</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="submissionsBody">
                        <tr>
                            <td colspan="5" style="text-align: center; padding: 40px; color: var(--text-muted);">
                                Loading submissions...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const formsService = require('../services/forms.service');
        const socketService = require('../services/socket.service');
        const { ipcRenderer } = require('electron');

        let templates = [];
        let submissions = [];

        async function init() {
            await loadTemplates();
            await loadSubmissions();

            // Setup Socket Listener
            socketService.connect();
            socketService.on('form_updated', (data) => {
                console.log('Real-time form update received:', data);
                loadSubmissions(); // Re-fetch to update the table
            });
        }

        async function loadTemplates() {
            try {
                templates = await formsService.getTemplates();
                // Remove Join Form from Desktop App (Onboarding only)
                templates = templates.filter(t => t.type !== 'join');
                renderTemplates();
            } catch (error) {
                console.error('Error loading templates:', error);
                document.getElementById('formsGrid').innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="empty-state-icon">⚠️</div>
                        <div>Failed to load form templates</div>
                    </div>
                `;
            }
        }

        function renderTemplates() {
            const grid = document.getElementById('formsGrid');

            if (templates.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="empty-state-icon">📋</div>
                        <div>No forms available</div>
                    </div>
                `;
                return;
            }

            const icons = {
                join: '👤',
                leave: '🏖️',
                custom: '📄'
            };

            const descriptions = {
                join: 'Complete your employee onboarding information',
                leave: 'Request time off with automatic balance tracking',
                custom: 'Custom form template'
            };

            grid.innerHTML = templates.map(template => `
                <div class="form-template-card" onclick="openForm(${template.id}, '${template.type}')">
                    <div class="template-icon">${icons[template.type] || '📄'}</div>
                    <div class="template-name">${template.name}</div>
                    <div class="template-description">${descriptions[template.type] || template.name}</div>
                </div>
            `).join('');
        }

        async function loadSubmissions() {
            try {
                submissions = await formsService.getMySubmissions();
                renderSubmissions();
            } catch (error) {
                console.error('Error loading submissions:', error);
                document.getElementById('submissionsBody').innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 40px; color: var(--accent-red);">
                            Failed to load submissions
                        </td>
                    </tr>
                `;
            }
        }

        function renderSubmissions() {
            const tbody = document.getElementById('submissionsBody');

            if (submissions.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <div>No submissions yet. Start by filling out a form above!</div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = submissions.map(sub => {
                const signatureCount = sub.Signatures?.filter(s => s.status === 'signed').length || 0;
                const totalSignatures = sub.Signatures?.length || 0;
                const isDraft = sub.status === 'draft';

                return `
                    <tr onclick="${isDraft ? `editSubmission(${sub.id}, '${sub.Template?.type}')` : `viewSubmission(${sub.id})`}">
                        <td><strong>${sub.Template?.name || 'Unknown'}</strong></td>
                        <td>${new Date(sub.submitted_at || sub.created_at).toLocaleDateString()}</td>
                        <td>${formsService.getStatusBadge(sub.status)}</td>
                        <td>${signatureCount}/${totalSignatures} Signed</td>
                        <td>
                            ${isDraft ? `
                                <button onclick="event.stopPropagation(); editSubmission(${sub.id}, '${sub.Template?.type}')" 
                                        style="padding: 4px 12px; background: var(--accent-emerald); border: none; border-radius: 6px; color: #000; font-weight: 700; cursor: pointer; margin-right: 5px;">
                                    Edit
                                </button>
                            ` : ''}
                            <button onclick="event.stopPropagation(); viewSubmission(${sub.id})" 
                                    style="padding: 4px 12px; background: var(--accent-blue); border: none; border-radius: 6px; color: #000; font-weight: 700; cursor: pointer;">
                                View
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function openForm(templateId, type) {
            if (type === 'join') {
                window.location.href = `join-form.html?template=${templateId}`;
            } else if (type === 'leave') {
                window.location.href = `leave-form.html?template=${templateId}`;
            }
        }

        function viewSubmission(id) {
            window.location.href = `submission-details.html?id=${id}`;
        }

        function editSubmission(id, type) {
            if (type === 'join') {
                window.location.href = `join-form.html?draft=${id}`;
            } else if (type === 'leave') {
                window.location.href = `leave-form.html?draft=${id}`;
            }
        }

        // Navigation
        function openDashboard() { window.location.href = 'dashboard.html'; }
        function openChat() { window.location.href = 'chat.html'; }
        function openFiles() { window.location.href = 'files.html'; }
        function logout() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = 'login.html';
        }

        init().then(() => {
            // Admin control moved to web
        });
    </script>
</body>

</html>
