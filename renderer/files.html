<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Targetup - File Manager</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .file-card {
            background: linear-gradient(145deg, rgba(21, 25, 28, 0.4), rgba(11, 14, 18, 0.6));
            border: 1px solid var(--border-subtle);
            backdrop-filter: var(--glass-blur);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.4s var(--ease-pro);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: var(--shadow-pro);
        }

        .file-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 163, 255, 0.1);
        }

        .file-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(to bottom, var(--accent-blue), transparent);
            opacity: 0.6;
        }

        .file-icon {
            font-size: 2.8rem;
            text-align: center;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.1));
        }

        .file-name {
            font-weight: 800;
            font-size: 0.85rem;
            color: #fff;
            letter-spacing: -0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-info {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }

        .upload-dropzone {
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 50px;
            text-align: center;
            transition: all 0.4s var(--ease-pro);
            cursor: pointer;
            background: rgba(255, 255, 255, 0.015);
            margin-bottom: 35px;
            position: relative;
            overflow: hidden;
        }

        .upload-dropzone:hover,
        .upload-dropzone.dragover {
            border-color: var(--accent-blue);
            background: rgba(0, 163, 255, 0.05);
            box-shadow: inset 0 0 30px rgba(0, 163, 255, 0.05);
        }

        .upload-icon {
            font-size: 3rem;
            color: var(--accent-blue);
            margin-bottom: 15px;
            filter: drop-shadow(0 0 20px var(--accent-blue-glow));
        }

        .progress-container {
            margin-top: 25px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), #00F3FF);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 15px var(--accent-blue-glow);
        }

        .category-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            padding: 0 5px;
        }

        .tab {
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 800;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            transition: all 0.3s;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .tab.active {
            background: var(--accent-blue);
            color: #000;
            border-color: var(--accent-blue);
            box-shadow: 0 10px 20px rgba(0, 163, 255, 0.2);
        }

        .tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="drag-overlay"></div>
    <div class="app-container">
        <!-- Navigation Rail -->
        <div class="nav-rail">
            <div class="nav-logo">T</div>
            <div class="nav-icon" onclick="openDashboard()" title="Dashboard">🏠</div>
            <div class="nav-icon" onclick="openChat()" title="Team Communications">💬</div>
            <div class="nav-icon" onclick="openForms()" title="Forms">📋</div>
            <div class="nav-icon active" title="File Management">📁</div>
            <div style="flex: 1;"></div>
            <div class="nav-icon" onclick="logout()" title="Log Out" style="color: var(--accent-red);">
                🔒</div>
        </div>

        <!-- Sidebar (Refined) -->
        <div class="sidebar">
            <div class="sidebar-header">STORAGE USAGE</div>
            <div class="sidebar-content">
                <div class="sidebar-item active" style="margin-bottom: 30px;">
                    <span style="font-size: 1.2rem;">📊</span>
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <span
                            style="font-weight: 900; color: #fff; font-size: 0.75rem; letter-spacing: 1px;">USAGE</span>
                        <span style="font-size: 0.7rem; color: var(--accent-blue);" id="usageText">Loading...</span>
                    </div>
                </div>

                <div
                    style="margin-bottom: 15px; padding: 0 15px; font-size: 0.65rem; font-weight: 900; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px;">
                    Filters</div>
                <div class="sidebar-item" onclick="filterFiles('document')"><span>📄</span> DOCUMENTS</div>
                <div class="sidebar-item" onclick="filterFiles('image')"><span>🖼️</span> IMAGES</div>
                <div class="sidebar-item" onclick="filterFiles('other')"><span>🎥</span> MEDIA</div>
                <div class="sidebar-item" onclick="filterFiles('all')"><span>📦</span> ALL FILES</div>
            </div>

            <div
                style="padding: 25px; border-top: 1px solid var(--border-subtle); font-size: 0.55rem; color: var(--text-muted); letter-spacing: 2px; font-weight: 700; opacity: 0.5;">
                SECURE STORAGE
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-stage glass-stage">
            <div class="stage-header" style="height: 64px;">
                <div class="stage-title">MY FILES</div>
                <div class="window-controls">
                    <div class="control-btn" onclick="minimizeToTray()">&#8211;</div>
                    <div class="control-btn control-close" onclick="minimizeToTray()">&times;</div>
                </div>
            </div>

            <div class="scroll-content" style="padding: 30px;">
                <!-- Upload Zone -->
                <div class="upload-dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">📤</div>
                    <h3
                        style="font-size: 1.2rem; font-weight: 900; color: #fff; letter-spacing: -0.5px; margin-bottom: 8px;">
                        UPLOAD FILES</h3>
                    <p style="color: var(--text-secondary); font-size: 0.85rem; letter-spacing: 0.5px;">Drag & drop
                        files or click to browse</p>
                    <input type="file" id="fileInput" style="display: none;" multiple>

                    <div class="progress-container" id="progressContainer">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                    <p id="progressLabel"
                        style="font-size: 0.7rem; font-weight: 800; color: var(--accent-blue); margin-top: 15px; display: none;">
                        UPLOADING...</p>
                </div>

                <!-- Filters -->
                <div class="category-tabs">
                    <div class="tab active" onclick="filterFiles('all')">ALL FILES</div>
                    <div class="tab" onclick="filterFiles('image')">IMAGES</div>
                    <div class="tab" onclick="filterFiles('document')">DOCUMENTS</div>
                    <div class="tab" onclick="filterFiles('other')">OTHERS</div>
                </div>

                <!-- File Grid -->
                <div class="file-grid" id="fileGrid">
                    <!-- Dynamic Loading -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const storageService = require('../services/storage.service');
        const apiService = require('../services/api.service');
        const { ipcRenderer } = require('electron');

        const fileGrid = document.getElementById('fileGrid');
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressLabel = document.getElementById('progressLabel');
        const usageText = document.getElementById('usageText');

        let allFiles = [];

        async function init() {
            await loadFiles();
        }

        async function loadFiles() {
            try {
                fileGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">Loading files...</div>';
                const files = await storageService.getFiles();
                allFiles = files;
                renderFiles(files);
                updateUsage(files);
            } catch (err) {
                fileGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--accent-red);">Failed to load repository</div>';
                console.error('File load error:', err);
            }
        }

        function renderFiles(files) {
            if (files.length === 0) {
                fileGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">Repository is empty</div>';
                return;
            }

            fileGrid.innerHTML = files.map(file => `
                <div class="file-card">
                    <div class="file-icon">${getFileIcon(file.mime_type)}</div>
                    <div class="file-name" title="${file.original_name}">${file.original_name}</div>
                    <div class="file-info">
                        <span>${formatFileSize(file.file_size)}</span>
                        <span>${new Date(file.createdAt).toLocaleDateString()}</span>
                    </div>
                    <div class="file-actions">
                        <div class="action-icon" onclick="downloadFile(${file.id})" title="Download">💾</div>
                        <div class="action-icon" onclick="deleteFile(${file.id})" title="Delete" style="margin-left: auto;">🗑️</div>
                    </div>
                </div>
            `).join('');
        }

        function getFileIcon(mime) {
            if (!mime) return '📄';
            if (mime.startsWith('image/')) return '🖼️';
            if (mime.startsWith('video/')) return '🎥';
            if (mime.includes('pdf')) return '📕';
            if (mime.includes('word')) return '📘';
            if (mime.includes('excel') || mime.includes('spreadsheet')) return '📗';
            if (mime.includes('zip') || mime.includes('rar')) return '📦';
            return '📄';
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function updateUsage(files) {
            const total = files.reduce((acc, f) => acc + parseInt(f.file_size), 0);
            usageText.textContent = `Total Usage: ${formatFileSize(total)}`;
        }

        function filterFiles(type) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            if (type === 'all') {
                renderFiles(allFiles);
            } else if (type === 'image') {
                renderFiles(allFiles.filter(f => f.mime_type?.startsWith('image/')));
            } else if (type === 'document') {
                renderFiles(allFiles.filter(f => f.mime_type?.includes('pdf') || f.mime_type?.includes('word') || f.mime_type?.includes('text')));
            } else {
                renderFiles(allFiles.filter(f => !f.mime_type?.startsWith('image/') && !f.mime_type?.includes('pdf') && !f.mime_type?.includes('word')));
            }
        }

        // Upload Handlers
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        async function handleFiles(files) {
            if (files.length === 0) return;

            progressContainer.style.display = 'block';
            progressLabel.style.display = 'block';

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                progressLabel.textContent = `Uploading [${i + 1}/${files.length}]: ${file.name}`;

                try {
                    await storageService.uploadFile(file, (percent) => {
                        progressBar.style.width = percent + '%';
                    });
                } catch (err) {
                    alert('Upload failed: ' + err.message);
                }
            }

            progressBar.style.width = '0%';
            progressContainer.style.display = 'none';
            progressLabel.style.display = 'none';
            await loadFiles();
        }

        async function downloadFile(id) {
            const url = storageService.getDownloadUrl(id);
            if (url) window.open(url + '&download=true');
        }

        async function deleteFile(id) {
            if (!confirm('Permanent deletion authorized?')) return;
            try {
                await storageService.deleteFile(id);
                await loadFiles();
            } catch (err) {
                alert('Deletion failed: ' + err.message);
            }
        }

        // Navigation
        function openDashboard() { window.location.href = 'dashboard.html'; }
        function openChat() { window.location.href = 'chat.html'; }
        function openForms() { window.location.href = 'forms.html'; }
        function minimizeToTray() { ipcRenderer.send('MINIMIZE_TO_TRAY'); }
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
        init().then(() => {
            // Admin control link moved to web
        });
    </script>
</body>

</html>
