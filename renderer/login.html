<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - TargetUp</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="drag-overlay"></div>

    <div class="login-stage">
        <div class="login-auth-card">
            <div style="text-align: center; margin-bottom: 40px;">
                <div class="nav-logo"
                    style="width: 64px; height: 64px; margin: 0 auto 24px; font-size: 1.8rem; border-radius: 18px;">T
                </div>
                <h1 style="font-size: 1.8rem; font-weight: 900; color: #fff; letter-spacing: -1px; margin-bottom: 8px;">
                    LOGIN</h1>
                <p style="font-size: 0.85rem; color: var(--text-secondary); letter-spacing: 0.5px;">PLEASE SIGN IN TO
                    CONTINUE</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="glass-label">Username</label>
                    <input type="text" id="username" class="login-field" required placeholder="name@company.com"
                        autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="glass-label">Password</label>
                    <input type="password" id="password" class="login-field" required placeholder="••••••••"
                        autocomplete="current-password">
                </div>

                <!-- Remember Me -->
                <div style="display: flex; align-items: center; gap: 10px; margin: 12px 0 4px;">
                    <input type="checkbox" id="rememberMe"
                        style="width: 16px; height: 16px; accent-color: var(--accent-blue); cursor: pointer; flex-shrink: 0;">
                    <label for="rememberMe"
                        style="font-size: 0.78rem; color: var(--text-secondary); cursor: pointer; user-select: none; letter-spacing: 0.5px;">
                        Remember me
                    </label>
                </div>

                <div id="errorMsg" class="login-error" style="display: none;"></div>

                <button type="submit" id="loginBtn" class="tactical-btn btn-primary"
                    style="height: 55px; margin-top: 10px; border-radius: 14px;">
                    <span id="btnText">SIGN IN</span>
                    <div id="btnSpinner" class="spinner" style="display: none; margin: 0 auto;"></div>
                </button>
            </form>

            <div
                style="margin-top: 40px; text-align: center; font-size: 0.6rem; color: var(--text-muted); font-weight: 900; letter-spacing: 2px; text-transform: uppercase; opacity: 0.5;">
                TargetUp v2.5

            </div>
        </div>
    </div>

    <script>
        const apiService = require('../services/api.service');
        const DeviceService = require('../services/device.service');
        const { ipcRenderer } = require('electron');

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const errorMsg = document.getElementById('errorMsg');
        const rememberMeCheckbox = document.getElementById('rememberMe');

        // Check for existing session or saved credentials on startup
        window.onload = () => {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            if (token && user) {
                console.log('Session found, redirecting to dashboard...');
                window.location.href = 'dashboard.html';
                return;
            }

            // Auto-fill saved credentials if Remember Me was used
            const savedUsername = localStorage.getItem('saved_username');
            const savedPassword = localStorage.getItem('saved_password');
            const savedRemember = localStorage.getItem('remember_me') === 'true';

            if (savedRemember && savedUsername) {
                document.getElementById('username').value = savedUsername;
                document.getElementById('password').value = savedPassword || '';
                rememberMeCheckbox.checked = true;
            }
        };

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // UI State: Loading
            loginBtn.disabled = true;
            btnText.style.display = 'none';
            btnSpinner.style.display = 'block';
            errorMsg.style.display = 'none';

            try {
                const u = document.getElementById('username').value.trim();
                const p = document.getElementById('password').value;
                const remember = rememberMeCheckbox.checked;

                const res = await apiService.login(u, p);

                // Save or clear credentials based on Remember Me
                if (remember) {
                    localStorage.setItem('saved_username', u);
                    localStorage.setItem('saved_password', p);
                    localStorage.setItem('remember_me', 'true');
                } else {
                    localStorage.removeItem('saved_username');
                    localStorage.removeItem('saved_password');
                    localStorage.setItem('remember_me', 'false');
                }

                localStorage.setItem('user', JSON.stringify(res.user));
                localStorage.setItem('token', res.token);

                // Register Device
                const dev = await DeviceService.getDeviceFingerprint(res.user.employee_id);
                try {
                    await apiService.registerDevice(dev);
                } catch (deviceErr) {
                    // Device is linked to another account — block login and show clear message
                    if (deviceErr.message && deviceErr.message.includes('linked to another account')) {
                        apiService.clearToken();
                        localStorage.removeItem('user');
                        localStorage.removeItem('token');
                        throw new Error('⚠️ This device is already linked to another account. Contact your administrator.');
                    }
                    // Non-critical device errors — log and continue
                    console.warn('Device registration warning:', deviceErr.message);
                }

                // Entrance Animation Delay
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 500);

            } catch (err) {
                errorMsg.textContent = err.message || 'Authentication Failed';
                errorMsg.style.display = 'block';

                // UI State: Reset
                loginBtn.disabled = false;
                btnText.style.display = 'block';
                btnSpinner.style.display = 'none';
            }
        });


        function minimizeToTray() { ipcRenderer.send('MINIMIZE_TO_TRAY'); }
    </script>
</body>

</html>
